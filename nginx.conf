server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Health check del contenedor `web`.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Archivos con hash: caché larga.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: toda ruta del navigation-map (/booking/confirmation/:code, /admin/...) sirve index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
